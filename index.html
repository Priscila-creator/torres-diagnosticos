<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><meta name="theme-color" content="#000000"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Torres"><meta name="apple-mobile-web-app-status-bar-style" content="black"></head><body>
<title>Torres Diagnósticos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Michroma&display=swap">
<style>
/* Layout: app de uma mão para a oficina. Topo preto com o logo e filete vermelho, conteúdo em coluna única, barra de abas embaixo. */
:root{
  color-scheme:dark;
  --bg:#0b0b0c; --surface:#161617; --surface2:#202022; --line:#2e2e31; --line2:#3d3d41;
  --red:#e0262c; --red-dark:#b41d22; --red-soft:#3a1416;
  --text:#f4f4f4; --muted:#a5a5aa; --ok:#3ccf6a; --warn:#f2b430;
  --display:"Michroma","Eurostile","Segoe UI",Arial,sans-serif;
  --body:"Barlow","Segoe UI",Roboto,Arial,sans-serif;
  --r:10px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:#000}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
h1,h2,h3,p{margin:0}
h2{font-family:var(--display);font-size:.82rem;font-weight:400;letter-spacing:.06em;text-transform:uppercase;text-wrap:balance}
h3{font-size:.78rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
small{font-size:.82rem;color:var(--muted)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#000;border-bottom:2px solid var(--red)}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;min-width:0}
.brand svg{height:38px;width:auto;display:block;max-width:100%}
.top-tag{font-family:var(--display);font-size:.6rem;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;white-space:nowrap}
.icon-btn{background:transparent;border:1px solid var(--line2);border-radius:8px;width:42px;height:42px;display:grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px}
.icon-btn[aria-current="true"]{background:var(--red);border-color:var(--red)}

main{max-width:760px;margin:0 auto;padding-block:18px 150px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>.grow{flex:1 1 140px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.muted{color:var(--muted)}
.note{font-size:.88rem;color:var(--muted)}

label.f{display:flex;flex-direction:column;gap:4px;font-size:.74rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;min-width:0}
input[type=text],input[type=search],input[type=number],select,textarea{width:100%;background:#0e0e0f;border:1px solid var(--line2);border-radius:8px;padding:11px 12px;font-size:1rem;outline:none;text-transform:none;letter-spacing:0;color:var(--text)}
input:focus,select:focus,textarea:focus{border-color:var(--red)}
textarea{min-height:92px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .wide{grid-column:1/-1}
.check{display:flex;align-items:center;gap:10px;font-size:1rem;color:var(--text);text-transform:none;letter-spacing:0;flex-direction:row}
.check input{width:20px;height:20px;accent-color:var(--red)}

.btn{background:var(--surface2);border:1px solid var(--line2);border-radius:8px;padding:11px 16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;text-align:center}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:active{background:var(--red-dark)}
.btn.block{width:100%}
.btn.sm{min-height:38px;padding:7px 12px;font-size:.92rem}
.btn:disabled{opacity:.5}
.link{background:none;border:0;color:var(--text);text-decoration:underline;text-decoration-color:var(--red);text-underline-offset:3px;padding:6px 0;font-weight:600}

/* veículo */
.veh-sum{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.veh-sum b{display:block;font-weight:600;overflow-wrap:anywhere}
.veh-sum span.edit{font-size:.82rem;color:var(--muted);white-space:nowrap}
.veh-form{border:1px solid var(--line);border-top:0;border-radius:0 0 var(--r) var(--r);padding:14px;background:var(--surface);margin-top:-12px}

/* IA */
.ai{border:1px solid var(--red);background:linear-gradient(180deg,var(--red-soft),var(--surface) 70%);border-radius:var(--r);padding:14px}
.tag{font-family:var(--display);font-size:.58rem;letter-spacing:.1em;background:var(--red);color:#fff;border-radius:4px;padding:3px 6px;vertical-align:middle}
.ai-status{display:flex;align-items:center;gap:10px;font-size:.95rem}
.spin{width:16px;height:16px;border:2px solid var(--line2);border-top-color:var(--red);border-radius:50%;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--surface);border:1px solid var(--line2);border-radius:999px;padding:8px 14px;font-size:.92rem;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--text);color:#000;border-color:var(--text);font-weight:600}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip.static{border-color:var(--red);background:var(--red-soft)}

/* sintomas */
.sym{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center;min-height:56px}
.sym .box{flex:none;width:24px;height:24px;border:2px solid var(--line2);border-radius:6px;display:grid;place-items:center}
.sym .txt{min-width:0;flex:1}
.sym .txt b{display:block;font-weight:500;line-height:1.3}
.sym[aria-pressed="true"]{border-color:var(--red);background:var(--red-soft)}
.sym[aria-pressed="true"] .box{background:var(--red);border-color:var(--red)}
.sym[aria-pressed="true"] .box::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.grp{margin-top:8px}

/* barra de ação */
.gobar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:15;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:linear-gradient(180deg,transparent,var(--bg) 35%)}
.gobar-in{max-width:728px;margin:0 auto;display:flex;gap:10px}
.gobar .btn.primary{flex:1;box-shadow:0 6px 20px rgba(0,0,0,.6)}

/* abas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#000;border-top:1px solid var(--line);padding:0 max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{background:none;border:0;border-top:3px solid transparent;margin-top:-1px;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--muted);position:relative}
.tab svg{width:22px;height:22px}
.tab span{font-family:var(--display);font-size:.54rem;letter-spacing:.08em;text-transform:uppercase}
.tab[aria-current="true"]{color:#fff;border-top-color:var(--red)}
.tab .badge{position:absolute;top:8px;left:calc(50% + 8px);background:var(--red);color:#fff;border-radius:999px;min-width:18px;height:18px;font:700 .72rem var(--body);display:grid;place-items:center;padding:0 5px}

/* alertas */
.alert{border-radius:var(--r);padding:12px 14px;border:1px solid var(--line2);background:var(--surface);display:flex;gap:12px;align-items:flex-start}
.alert .dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:7px;background:var(--warn)}
.alert.stop{border-color:var(--red);background:var(--red-soft)}
.alert.stop .dot{background:var(--red)}
.alert b{display:block}
ul.plain,ol.steps{margin:0;padding-left:1.25em;display:flex;flex-direction:column;gap:6px}
ol.steps li::marker{color:var(--red);font-weight:700}

/* causas */
details.cause{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
details.cause[open]{border-color:var(--line2)}
details.cause summary{list-style:none;padding:14px;display:flex;flex-direction:column;gap:9px;cursor:pointer}
details.cause summary::-webkit-details-marker{display:none}
.c-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.c-name{font-weight:600;font-size:1.05rem;line-height:1.3;min-width:0}
.c-pct{font-family:var(--display);font-size:.9rem;font-variant-numeric:tabular-nums;flex:none}
.c-lvl{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.c-lvl.hi{color:var(--red);font-weight:700}
/* conta-giros: probabilidade em traços, como a escala de um tacômetro */
.rev{height:10px;position:relative;background:repeating-linear-gradient(90deg,var(--line2) 0 3px,transparent 3px 7px)}
.rev::after{content:"";position:absolute;inset:0 auto 0 0;width:calc(var(--v)*1%);background:repeating-linear-gradient(90deg,var(--red) 0 3px,transparent 3px 7px)}
.c-cost{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.c-cost b{font-weight:600}
.c-more{font-size:.82rem;color:var(--muted)}
details[open] .c-more .b,details:not([open]) .c-more .a{display:none}
.c-body{border-top:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:16px}
.c-body section{display:flex;flex-direction:column;gap:7px}
.parts{display:flex;flex-direction:column}
.parts div{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line);font-variant-numeric:tabular-nums}
.parts div span:first-child{min-width:0}
.parts div span:last-child{white-space:nowrap;text-align:right}
.parts div.tot{border-bottom:0;font-weight:700;padding-top:10px}
.opt{font-size:.74rem;color:var(--muted)}
.tip{border-left:0;background:var(--surface2);border-radius:8px;padding:10px 12px;font-size:.94rem}

/* códigos */
.code-row{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;align-items:baseline}
.code-row b{font-family:var(--display);font-size:.72rem;flex:0 0 108px;font-weight:400;color:var(--muted)}
.code-big{font-family:var(--display);font-size:1.3rem}

/* orçamento */
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px}
.item-top{display:flex;gap:8px;align-items:flex-start}
.item-top input{flex:1;min-width:0;font-weight:600}
.x{flex:none;width:44px;height:46px;border:1px solid var(--line2);background:none;border-radius:8px;font-size:1.2rem;color:var(--muted)}
.item-sub{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.92rem}
.totals{display:flex;flex-direction:column;font-variant-numeric:tabular-nums}
.totals div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line)}
.totals .grand{border-bottom:0;padding-top:14px;align-items:baseline}
.totals .grand span:first-child{font-family:var(--display);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase}
.totals .grand span:last-child{font-size:1.7rem;font-weight:700;color:#fff}
.empty{border:1px dashed var(--line2);border-radius:var(--r);padding:26px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
pre.copy{white-space:pre-wrap;background:#0e0e0f;border:1px solid var(--line2);border-radius:8px;padding:12px;font:inherit;font-size:.92rem;margin:0;user-select:all;-webkit-user-select:all}

/* links externos, modelos, revisão */
a{color:inherit}
a.btn{text-decoration:none}
.links{display:flex;flex-wrap:wrap;gap:8px}
.xl{display:inline-flex;align-items:center;min-height:40px;padding:7px 12px;border:1px solid var(--line2);border-radius:8px;text-decoration:none;font-size:.92rem;font-weight:600;background:var(--surface2)}
.xl::after{content:"↗";margin-left:6px;color:var(--red)}
.plinks{display:block;font-size:.82rem;color:var(--muted);margin-top:2px}
.pl{text-decoration:underline;text-decoration-color:var(--red);text-underline-offset:3px;padding:5px 0;display:inline-block;color:var(--text)}
.c-flag{align-self:flex-start;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;background:var(--warn);color:#000;border-radius:4px;padding:2px 7px}
details.fold{background:var(--surface);border:1px solid var(--warn);border-radius:var(--r)}
details.fold summary{list-style:none;padding:12px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-weight:600}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary::after{content:"+";color:var(--warn);font-weight:700}
details.fold[open] summary::after{content:"–"}
.fold-b{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.pill{flex:none;font-size:.74rem;border:1px solid var(--line2);border-radius:999px;padding:2px 9px;color:var(--muted);white-space:nowrap}
.pill.hot{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
.rev-top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.parts.ref div span:last-child{white-space:normal;max-width:55%}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fff;color:#000;font-weight:600;border-radius:999px;padding:10px 18px;z-index:40;box-shadow:0 8px 30px rgba(0,0,0,.6);max-width:calc(100% - 32px);text-align:center}
@media (max-width:380px){.top-tag{display:none}.code-row b{flex-basis:92px}}
</style>

  <div class="brand">

motor_partida:['Reparar ou trocar o motor de partida','partida',[1,2.5],[['Automático de partida',90,250],['Motor de partida recondicionado',400,950,1]],

      const r=REP[c[0]];if(!r||!applies(r)||fora.has(r.id))continue;
      const e=m.get(r.id)||{r,score:0,n:0,sinais:[]};
      e.score+=c[1];e.n++;e.sinais.push({s:s.t,x:c[2]});m.set(r.id,e);
    }
  }
  const arr=[...m.values()];
  arr.forEach(e=>{e.score*=1+0.35*(e.n-1);if(fr[e.r.id]){e.score*=1.4;e.fraco=fr[e.r.id]}});
  const tot=arr.reduce((a,e)=>a+e.score,0)||1;
  arr.forEach(e=>{e.pct=Math.round(e.score/tot*100)});
  return arr.sort((a,b)=>b.score-a.score);
}
const STOP=new Set('o a os as de do da dos das que esta ta meu minha carro com no na um uma e ao quando muito tem fica ficando faz fazendo para pra em'.split(' '));
function buscaSintomas(q){
  const tk=norm(q).split(/[^a-z0-9]+/).filter(t=>t.length>1&&!STOP.has(t));
  if(!tk.length)return null;
  const out=[];
  for(const s of SYM){
    const hay=norm(s.t+' '+s.k+' '+SIS[s.sis]);let n=0;
    for(const t of tk){if(hay.includes(t)||(t.length>4&&hay.includes(t.slice(0,-1))))n++}
    if(n)out.push({s,n});
  }
  return out.sort((a,b)=>b.n-a.n).map(o=>o.s);
}

/* lê um relato em texto livre e devolve os sintomas da base que mais combinam */
const STOP2=new Set('motor carro problema cliente disse falou ele ela depois mais menos ainda hoje ontem vez vezes sempre tambem mas por isso esse essa aquele quando muito pouco'.split(' '));
const stem=t=>{const s=t.replace(/(ando|endo|indo|ar|er|ir|ou|a|o|e|s)$/,'');return s.length>=3?s:t};
const toks=s=>norm(s).split(/[^a-z0-9]+/).filter(t=>t.length>2&&!STOP.has(t)&&!STOP2.has(t)).map(stem);
const hit=(a,b)=>a===b||(Math.min(a.length,b.length)>=4&&(a.startsWith(b)||b.startsWith(a)));
let IDX=null;
/* sintomas que só valem se o relato trouxer certas palavras, ou só para diesel */
const EXIGE={nao_esquenta:['nao','demor','fri']},SO_DIESEL=new Set(['diesel_partida','dpf_luz']);
function entender(txt){
  const q=[...new Set(toks(txt))];if(!q.length)return [];
  if(!IDX)IDX=SYM.map(s=>({id:s.id,t:toks(s.t),k:toks(s.k)}));
  /* palavra que aparece em muitos sintomas (luz, barulho) pesa menos que palavra rara */
  const peso=w=>{const df=IDX.filter(x=>x.t.some(h=>hit(w,h))||x.k.some(h=>hit(w,h))).length;return df?1/Math.sqrt(df):0};
  const sc=[];
  for(const x of IDX){
    if(SO_DIESEL.has(x.id)&&V.comb!=='diesel')continue;
    if(EXIGE[x.id]&&!q.some(w=>EXIGE[x.id].some(e=>hit(w,e))))continue;
    let n=0;for(const w of q){const p=peso(w);if(x.t.some(h=>hit(w,h)))n+=2*p;else if(x.k.some(h=>hit(w,h)))n+=p}
    if(n>0)sc.push({id:x.id,n});
  }
  if(!sc.length)return [];
  sc.sort((a,b)=>b.n-a.n);
  return sc.filter(x=>x.n>=sc[0].n*0.6).slice(0,3).map(x=>x.id);
}

    ${REF.map(g=>`<div class="panel stack"><h3>${esc(g[0])}</h3><div class="parts ref">${g[1].map(x=>`<div><span>${esc(x[0])}</span><span>${esc(x[1])}</span></div>`).join('')}</div></div>`).join('')}`;
  if(mtab==='mod')return `<div class="stack"><h2>Manual da oficina</h2>${chips}
    <input type="search" id="modQ" value="${esc(modQ)}" placeholder="Ex.: Onix, HB20, Sandero" autocomplete="off" aria-label="Buscar modelo">
    <small>Defeitos que mais aparecem em cada família de modelos. Servem de pista, não de sentença: confirme com teste.</small></div>
    <div class="stack" id="modList">${modListHTML()}</div>`;
  return `<div class="stack"><h2>Manual da oficina</h2>${chips}
    <input type="search" id="servQ" value="${esc(servQ)}" placeholder="Ex.: embreagem, pastilha, correia" autocomplete="off" aria-label="Buscar serviço">
    <small>${Object.keys(R).length} serviços com teste, passo a passo, peças e custo base para: ${esc(vehDetail())}.</small></div>
  <div class="stack" id="servList">${servListHTML()}</div>${AVISO}`;
}
function totais(){
  let pc=0,mo=0;for(const it of ORC.itens){pc+=num(it.pecas);mo+=num(it.horas)*CFG.hora}
  const pv=pc*(1+CFG.margem/100);return {pc,pv,mo,total:pv+mo};
}
function itemSub(it){const pv=num(it.pecas)*(1+CFG.margem/100),mo=num(it.horas)*CFG.hora;return `Peças ${brl(pv)} + mão de obra ${brl(mo)} = <b style="color:var(--text)">${brl(pv+mo)}</b>`}
function totaisHTML(){
  const t=totais();
  return `<div><span>Peças, seu custo</span><span>${brl(t.pc)}</span></div>
  <div><span>Peças para o cliente (+${CFG.margem}%)</span><span>${brl(t.pv)}</span></div>
  <div><span>Mão de obra (${brl(CFG.hora)}/h)</span><span>${brl(t.mo)}</span></div>
  <div class="grand"><span>Total</span><span>${brl(t.total)}</span></div>`;
}
function orcTexto(){
  const t=totais(),L=[];
  L.push('*TORRES SERVIÇOS AUTOMOTIVOS*','Orçamento · '+new Date().toLocaleDateString('pt-BR'));
  if(str(ORC.cliente))L.push('Cliente: '+str(ORC.cliente));
  if(vehName())L.push('Veículo: '+vehName());
  L.push('');
  ORC.itens.forEach((it,i)=>{const pv=num(it.pecas)*(1+CFG.margem/100),mo=num(it.horas)*CFG.hora;
    L.push((i+1)+'. '+(str(it.n)||'Serviço'));
    L.push('   '+[pv?'Peças '+brl(pv):'',mo?'Mão de obra '+brl(mo):''].filter(Boolean).join(' · '))});
  L.push('','Peças: '+brl(t.pv),'Mão de obra: '+brl(t.mo),'*Total: '+brl(t.total)+'*','','Valores estimados, sujeitos a confirmação após a desmontagem.');
  return L.join('\n');
}
function vOrc(){
  if(!ORC.itens.length)return `<div class="stack"><h2>Orçamento</h2></div>
  <div class="empty"><span>Nenhum serviço no orçamento ainda.</span><span>Faça um diagnóstico e toque em “Adicionar ao orçamento” na causa confirmada. Peças e horas entram aqui e você ajusta os valores.</span>
  <button class="btn primary" data-act="tab" data-v="diag">Fazer diagnóstico</button><button class="btn" data-act="orcNovo">Adicionar item avulso</button></div>`;
  return `<div class="stack"><h2>Orçamento</h2>
    <label class="f">Cliente<input type="text" id="orc-cliente" value="${esc(ORC.cliente)}" placeholder="Nome do cliente" autocomplete="off"></label>
    <small>${esc(vehName()||'Veículo não informado')} · ${esc(vehDetail())}</small></div>
  <div class="stack">${ORC.itens.map((it,i)=>`<div class="item" data-i="${i}">
    <div class="item-top"><input type="text" id="it-n-${i}" data-f="n" value="${esc(it.n)}" aria-label="Serviço"><button class="x" data-act="orcDel" data-i="${i}" aria-label="Remover item">×</button></div>
    <div class="grid2"><label class="f">Peças, seu custo (R$)<input type="number" id="it-p-${i}" data-f="pecas" value="${esc(it.pecas)}" inputmode="decimal" min="0" step="10"></label>
    <label class="f">Horas de serviço<input type="number" id="it-h-${i}" data-f="horas" value="${esc(it.horas)}" inputmode="decimal" min="0" step="0.5"></label></div>
    <div class="item-sub" id="it-s-${i}">${itemSub(it)}</div></div>`).join('')}
    <button class="btn" data-act="orcNovo">Adicionar item avulso</button></div>
  <div class="panel"><div class="totals" id="totais">${totaisHTML()}</div></div>
  <div class="stack"><button class="btn primary block" data-act="copiar">Copiar orçamento para o WhatsApp</button>
    <pre class="copy" id="copyOut" hidden></pre>
    <button class="btn block" data-act="orcLimpar" id="orcLimpar">Limpar orçamento</button></div>
  <p class="note">O texto copiado mostra ao cliente o preço final de cada serviço, sem o seu custo de peças.</p>`;
}
function vCfg(){
  return `<div class="stack"><h2>Ajustes da oficina</h2><small>Usados em todos os custos mostrados no app. Ficam salvos neste aparelho.</small></div>
  <div class="panel"><div class="grid2">
    <label class="f">Valor da hora (R$)<input type="number" id="cfg-hora" value="${CFG.hora}" inputmode="decimal" min="0" step="5"></label>
    <label class="f">Margem nas peças (%)<input type="number" id="cfg-margem" value="${CFG.margem}" inputmode="decimal" min="0" step="5"></label>
  </div></div>
  <div class="panel stack"><h3>Como o custo é calculado</h3>
    <p>Cada serviço tem uma faixa de preço de peças e de horas para carro popular. A categoria do veículo multiplica esses valores:</p>
    <div class="parts">${Object.values(CAT).map(c=>`<div><span>${esc(c.n)}</span><span>peças × ${String(c.p).replace('.',',')} · horas × ${String(c.h).replace('.',',')}</span></div>`).join('')}</div>
    <p>Preço para o cliente = peças com a sua margem + horas × valor da hora.</p></div>
  <div class="panel stack"><h3>Sobre</h3>
    <p>${SYM.length} sintomas, ${Object.keys(R).length} serviços, ${OBD.length} faixas de códigos de falha e ${MOD.length} famílias de modelos com pontos fracos. Os preços são referências de mercado de reposição e mudam por região e marca da peça.</p>
    <p class="muted">As buscas na internet abrem o Google, o Mercado Livre e o YouTube em outra aba, já com o carro e a peça escritos. Não precisam de conta.</p></div>`;
}

/* ---------- render ---------- */
function updateGo(){
  const on=view==='diag'&&sub==='lista'&&sel.size>0;
  $('#gobar').hidden=!on;
  if(on)$('#goBtn').textContent='Ver diagnóstico · '+sel.size+(sel.size>1?' sintomas':' sintoma');
  const g=$('#gLink');if(g)g.href=gAI(casoQ());
}
function updateBadge(){const b=$('#orcBadge');b.hidden=!ORC.itens.length;b.textContent=ORC.itens.length}
function render(top){
  const m=$('#main');
  m.innerHTML=view==='diag'?vDiag():view==='cod'?vCod():view==='serv'?vMan():view==='orc'?vOrc():vCfg();
  document.querySelectorAll('.tab').forEach(t=>{if(t.dataset.v===view)t.setAttribute('aria-current','true');else t.removeAttribute('aria-current')});
  const cb=$('#cfgBtn');if(view==='cfg')cb.setAttribute('aria-current','true');else cb.removeAttribute('aria-current');
  updateGo();updateBadge();
  if(top)window.scrollTo(0,0);
}
let toastT=0;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},2200)}
const saveV=()=>store.set('v',V),saveOrc=()=>store.set('orc',ORC);

/* ---------- IA dentro do Claude (quando disponível) ---------- */
const AIERR={
  rate_limited:'Limite de uso do Claude atingido. Tente de novo daqui a pouco.',
  session_expired:'A sessão do Claude expirou. Entre na conta de novo e tente outra vez.',
  image_rejected:'A foto não foi aceita. Tente outra imagem (JPG ou PNG).',
  images_unavailable:'Não foi possível enviar fotos aqui. Tente só com o texto.',
  refused:'A IA não pôde responder a esse pedido. Reescreva a descrição.',
  empty_completion:'A IA não respondeu. Descreva com outras palavras.',
  invalid_json:'A resposta veio incompleta. Toque em Analisar de novo.',
  prompt_too_large:'Texto longo demais. Resuma a descrição.',
  upstream_error:'Falha de conexão com a IA. Tente de novo.'
};
const AIOFF=new Set(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed']);
function aiPrompt(){
  const syms=SYM.filter(s=>sel.has(s.id)).map(s=>s.t),fr=modelos().flatMap(m=>m.it.map(i=>i[1]));
  return `Você é um mecânico-chefe brasileiro com décadas de oficina, ajudando uma oficina independente (Torres Serviços Automotivos) a diagnosticar um carro. Escreva em português do Brasil, direto e prático, com os termos usados em oficina.

VEÍCULO: ${vehName()||'não informado'} (${vehDetail()})
RELATO: ${aiText.trim()||'sem relato escrito'}
SINTOMAS MARCADOS: ${syms.length?syms.join('; '):'nenhum'}
${fr.length?'PONTOS FRACOS CONHECIDOS DO MODELO (pista, não certeza): '+fr.join('; ')+'\n':''}${aiFiles.length?'FOTOS: as imagens anexas foram tiradas pelo mecânico (painel, peça, vazamento ou tela do scanner). Use o que elas mostram.\n':''}
Responda SOMENTE com um objeto JSON, sem texto antes ou depois, neste formato:
{"resumo":"2 ou 3 frases com a leitura do caso","urgencia":"baixa|media|alta","perguntas":["perguntas ao cliente ou verificações rápidas que fechariam o diagnóstico"],"causas":[{"nome":"serviço ou defeito","probabilidade":40,"sinais":"por que suspeitar disso neste caso","testes":["como confirmar na oficina, com valores de referência"],"passos":["como acessar, desmontar e executar o reparo, em ordem, com cuidados de segurança"],"ferramentas":"ferramentas necessárias","pecas":[{"nome":"peça","min":100,"max":200}],"horas_min":1,"horas_max":2}]}

Regras: de 3 a 5 causas, da mais para a menos provável, específicas para este veículo e motor; probabilidades em números inteiros somando perto de 100; preços em reais = custo da peça de reposição para a oficina no Brasil, para este modelo; horas = tempo de mão de obra; se não houver peça, "pecas":[]; no máximo 4 perguntas; passos com 4 a 7 itens curtos.`;
}
function parseIA(d){
  d=d&&typeof d==='object'?d:{};
  const causas=(Array.isArray(d.causas)?d.causas:[]).slice(0,6).filter(c=>c&&typeof c==='object').map((c,i)=>{
    const id='ia'+i,h0=num(c.horas_min),h1=Math.max(h0,num(c.horas_max));
    REP[id]={id,ai:true,n:str(c.nome)||'Causa '+(i+1),sis:'ia',h:[h0,h1],
      p:(Array.isArray(c.pecas)?c.pecas:[]).filter(p=>p&&typeof p==='object'&&str(p.nome)).map(p=>[str(p.nome),num(p.min),Math.max(num(p.min),num(p.max))]),
      t:list(c.testes).join(' '),passos:list(c.passos),fer:str(c.ferramentas)};
    return {r:REP[id],pct:Math.min(100,Math.round(num(c.probabilidade))),sinais:str(c.sinais)};
  });
  const u=norm(str(d.urgencia));
  return {resumo:str(d.resumo),urg:u==='alta'?'alta':u==='media'?'media':'baixa',perguntas:list(d.perguntas).slice(0,5),causas};
}
async function aiGo(){
  if(!sample||aiBusy)return;
  if(!aiText.trim()&&!sel.size&&!aiFiles.length){toast('Descreva o problema ou marque um sintoma');return}
  aiBusy=true;aiErr='';aiCtl=new AbortController();render();
  const opts={signal:aiCtl.signal};if(aiFiles.length)opts.images=aiFiles;
  let ok=false;
  try{IA=parseIA(await sample.json(aiPrompt(),opts));ok=true}
  catch(e){
    const code=e&&e.code;
    if(AIOFF.has(code))aiState='off';
    else if(code!=='cancelled')aiErr=AIERR[code]||AIERR.upstream_error;
    if(code==='images_unavailable'){aiImg=null;aiFiles=[]}
  }
  aiBusy=false;
  if(ok){sub='ia';if(view==='diag')render(true);else toast('Análise da IA pronta na aba Diagnóstico')}
  else if(view==='diag')render();
}
/* A análise pelo Claude foi desligada a pedido: o app usa só a IA do Google, igual para todos. */
aiState='off';

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(a==='tab'){const v=b.dataset.v;if(v==='diag'&&view==='diag')sub='lista';view=v;codIdx=-1;render(true)}
  else if(a==='sym'){const id=b.dataset.id;if(sel.has(id))sel.delete(id);else sel.add(id);auto.delete(id);fora.clear();b.setAttribute('aria-pressed',sel.has(id));updateGo()}
  else if(a==='sis'){sisF=b.dataset.k;filtro='';const q=$('#q');if(q)q.value='';$('#sisChips').innerHTML=chipsHTML();$('#symList').innerHTML=symListHTML()}
  else if(a==='mtab'){mtab=b.dataset.k;render(true)}
  else if(a==='go'){sub='res';render(true)}
  else if(a==='diagTxt'){
    entender(aiText).forEach(id=>{if(!sel.has(id)){sel.add(id);auto.add(id)}});
    if(!sel.size){askMsg=aiText.trim()?'Não reconheci um sintoma nesse relato. Tente outras palavras, marque na lista abaixo ou consulte a IA do Google.':'Escreva o problema ou marque um sintoma na lista abaixo.';render()}
    else{askMsg='';fora.clear();sub='res';render(true)}
  }
  else if(a==='unsym'){sel.delete(b.dataset.id);auto.delete(b.dataset.id);fora.clear();if(!sel.size)sub='lista';render(true)}
  else if(a==='clearSel'){sel.clear();fora.clear();auto.clear();$('#symList').innerHTML=symListHTML();updateGo()}
  else if(a==='back'){sub='lista';render(true)}
  else if(a==='veh'){vehOpen=!vehOpen;render()}
  else if(a==='desc'){fora.add(b.dataset.rid);render();toast('Causa descartada. Lista recalculada.')}
  else if(a==='descUndo'){fora.clear();render()}
  else if(a==='add'){
    const r=REP[b.dataset.rid];if(!r)return;const c=custo(r);
    ORC.itens.push({n:r.n,pecas:r10((c.pmin+c.pmax)/2),horas:Math.round(c.hmin+c.hmax)/2});
    saveOrc();updateBadge();b.textContent='Adicionado ✓';toast('Adicionado ao orçamento');
  }
  else if(a==='code'){codIdx=+b.dataset.i;codQ='';const i=$('#codQ');if(i)i.value='';$('#codRes').innerHTML=codResHTML();window.scrollTo(0,0)}
  else if(a==='orcNovo'){ORC.itens.push({n:'',pecas:0,horas:1});saveOrc();render();const i=$('#it-n-'+(ORC.itens.length-1));if(i)i.focus()}
  else if(a==='orcDel'){ORC.itens.splice(+b.dataset.i,1);saveOrc();render()}
  else if(a==='orcLimpar'){
    if(Date.now()-clearArmed<4000){ORC={cliente:'',itens:[]};saveOrc();clearArmed=0;render(true);toast('Orçamento limpo')}
    else{clearArmed=Date.now();b.textContent='Toque de novo para limpar tudo';setTimeout(()=>{const x=$('#orcLimpar');if(x)x.textContent='Limpar orçamento'},4000)}
  }
  else if(a==='copiar'){
    const txt=orcTexto(),out=$('#copyOut');
    const fallback=()=>{out.textContent=txt;out.hidden=false;toast('Segure o texto abaixo para copiar')};
    try{navigator.clipboard.writeText(txt).then(()=>toast('Copiado. Cole no WhatsApp.'),fallback)}catch(err){fallback()}
  }
  else if(a==='aiGo')aiGo();
  else if(a==='aiStop'){if(aiCtl)aiCtl.abort()}
  else if(a==='aiFotoX'){aiFiles=[];render()}
});
document.addEventListener('input',e=>{
  const t=e.target,id=t.id;
  if(id==='q'){filtro=t.value;$('#symList').innerHTML=symListHTML()}
  else if(id==='aiTxt'){aiText=t.value;updateGo()}
  else if(id==='v-modelo'){V.modelo=t.value;saveV()}
  else if(id==='v-ano'){V.ano=t.value;const y=parseInt(t.value,10);if(y>=1950&&y<=2035){V.era=y<1997?'c':y<=2012?'i':'m';const s=$('#v-era');if(s)s.value=V.era}saveV()}
  else if(id==='codQ'){codQ=t.value.toUpperCase().replace(/[^A-Z0-9]/g,'');codIdx=-1;$('#codRes').innerHTML=codResHTML()}
  else if(id==='servQ'){servQ=t.value;$('#servList').innerHTML=servListHTML()}
  else if(id==='revKm'){revKm=t.value;$('#revList').innerHTML=revListHTML()}
  else if(id==='modQ'){modQ=t.value;$('#modList').innerHTML=modListHTML()}
  else if(id==='orc-cliente'){ORC.cliente=t.value;saveOrc()}
  else if(id==='cfg-hora'){CFG.hora=num(t.value);store.set('cfg',CFG)}
  else if(id==='cfg-margem'){CFG.margem=num(t.value);store.set('cfg',CFG)}
  else if(t.dataset.f){
    const box=t.closest('.item');if(!box)return;const i=+box.dataset.i,it=ORC.itens[i];if(!it)return;
    it[t.dataset.f]=t.dataset.f==='n'?t.value:num(t.value);saveOrc();
    $('#it-s-'+i).innerHTML=itemSub(it);$('#totais').innerHTML=totaisHTML();
  }
});
document.addEventListener('change',e=>{
  const t=e.target,id=t.id;
  if(id==='v-era'||id==='v-cat'||id==='v-comb'||id==='v-cambio'){V[id.slice(2)]=t.value;saveV()}
  else if(id==='v-turbo'){V.turbo=t.checked;saveV()}
  else if(id==='aiFoto'){aiFiles=Array.from(t.files||[]).slice(0,aiImg&&aiImg.maxCount||1);render()}
});
render();
})();
